const KEY='hq-ex-shopping-v1';
const seed=()=>({products:BASE,events:[{id:'event-tokyo-1',name:'東京会場',date:'2026-11-02',venue:'森アーツセンターギャラリー'},{id:'event-tokyo-2',name:'東京会場2回目',date:'2026-11-04',venue:'森アーツセンターギャラリー'}],items:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(db.products)||!Array.isArray(db.events)||!Array.isArray(db.items))db=seed()}catch(e){db=seed()}
let screen='catalog',eventId='',query='',category='すべて',vendor='すべて',onlyUnadded=false;
const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('保存できませんでした。ブラウザの保存容量や設定を確認してください。')}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function tab(s){screen=s;render()}
function img(p){return p.image_url?`<img class="thumb" loading="lazy" src="${esc(p.image_url)}" alt="" onerror="this.style.visibility='hidden'">`:`<div class="thumb"></div>`}
function productCard(p,action='add'){let btn=action==='add'?`<button class="primary" onclick="addItem('${esc(p.id)}')">＋ リストに追加</button>`:`<button onclick="editProduct('${esc(p.id)}')">編集</button>`;return `<div class="card"><div class="row">${img(p)}<div class="grow"><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.category)} · ${esc(p.vendor||'会場未設定')}</div><div class="price">${yen(p.price)}</div></div></div><div class="row between" style="margin-top:8px"><span></span>${btn}</div></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));$('tab'+(screen==='catalog'?'Catalog':screen==='events'||screen==='detail'?'Events':'Settings')).classList.add('active');if(screen==='catalog')catalog();else if(screen==='events')events();else if(screen==='detail')detail();else settings()}
function catalog(){const cats=['すべて',...new Set(db.products.map(p=>p.category).filter(Boolean))];const vendors=['すべて',...new Set(db.products.map(p=>p.vendor).filter(Boolean))];$('view').innerHTML=`<div class="row between"><h2>商品一覧 <span class="muted">${db.products.length}件</span></h2><button class="primary" onclick="editProduct()">＋ 商品登録</button></div><div class="fields"><input id="search" placeholder="商品名で検索" value="${esc(query)}" oninput="query=this.value;catalogResults()"><div class="row"><select id="cat" onchange="category=this.value;catalogResults()">${cats.map(x=>`<option ${category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="vendor" onchange="vendor=this.value;catalogResults()">${vendors.map(x=>`<option ${vendor===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div id="results"></div>`;catalogResults()}
function catalogResults(){const list=db.products.filter(p=>(category==='すべて'||p.category===category)&&(vendor==='すべて'||p.vendor===vendor)&&p.name.toLowerCase().includes(query.toLowerCase()));$('results').innerHTML=`<div class="muted" style="margin-bottom:8px">検索結果 ${list.length}件</div>`+(list.length?list.map(p=>productCard(p,'edit')).join(''):'<div class="empty">該当する商品はありません</div>')}
function events(){$('view').innerHTML=`<div class="row between"><h2>イベント一覧</h2><button class="primary" onclick="editEvent()">＋ イベント追加</button></div><div class="hint">イベントごとに購入リストを作れます。東京・大阪・仙台など、何回でも追加できます。</div>`+db.events.map(e=>{const items=db.items.filter(i=>i.eventId===e.id);const total=items.reduce((s,i)=>s+priceOf(i)*i.qty,0);return `<div class="card"><div class="row between"><div class="grow"><div class="name">${esc(e.name)}</div><div class="muted">📅 ${esc(e.date||'日付未設定')}　📍 ${esc(e.venue||'')}</div><div style="margin-top:7px"><b>${yen(total)}</b> <span class="muted">· ${items.filter(i=>i.done).length}/${items.length}件 購入済み</span></div></div><button class="primary" onclick="openEvent('${esc(e.id)}')">開く</button></div><div style="margin-top:7px"><button class="small" onclick="editEvent('${esc(e.id)}')">イベント編集</button></div></div>`}).join(''))}
function priceOf(i){const p=db.products.find(p=>p.id===i.productId);return p?Number(p.price):Number(i.price||0)}
function openEvent(id){eventId=id;screen='detail';render()}
function detail(){const e=db.events.find(x=>x.id===eventId);if(!e){screen='events';return render()}const items=db.items.filter(i=>i.eventId===eventId);const planned=items.reduce((s,i)=>s+priceOf(i)*i.qty,0),paid=items.filter(i=>i.done).reduce((s,i)=>s+priceOf(i)*i.qty,0);$('view').innerHTML=`<button onclick="tab('events')">‹ イベント一覧へ</button><div class="row between"><h2>${esc(e.name)}</h2><button class="primary" onclick="pickProduct()">＋ 商品を追加</button></div><div class="muted">📅 ${esc(e.date||'')}　📍 ${esc(e.venue||'')}</div><div class="stats"><div class="stat"><small>購入予定総額</small><strong>${yen(planned)}</strong></div><div class="stat"><small>購入済み金額</small><strong>${yen(paid)}</strong></div><div class="stat"><small>残りの予定額</small><strong>${yen(planned-paid)}</strong></div></div><div class="muted">購入済み ${items.filter(i=>i.done).length} / ${items.length}件</div><h2>未購入（${items.filter(i=>!i.done).length}件）</h2>${items.filter(i=>!i.done).map(itemCard).join('')||'<div class="empty">未購入の商品はありません</div>'}<h2>購入済み（${items.filter(i=>i.done).length}件）</h2>${items.filter(i=>i.done).map(itemCard).join('')||'<div class="empty">購入済みの商品はありません</div>'}`}
function itemCard(i){const p=db.products.find(p=>p.id===i.productId)||{name:i.name||'削除された商品',price:i.price||0};return `<div class="card ${i.done?'purchased':''}"><div class="row"><input class="check" aria-label="購入済みにする" type="checkbox" ${i.done?'checked':''} onchange="toggleItem('${esc(i.id)}')">${img(p)}<div class="grow"><div class="name">${esc(p.name)}</div><div class="muted">単価 ${yen(priceOf(i))}</div><div class="pill">${esc(p.category||'')}</div></div></div><div class="row between" style="margin-top:10px"><div class="controls">数量 <button onclick="qtyItem('${esc(i.id)}',-1)" ${i.qty<=1?'disabled':''}>－</button><b class="qty">${i.qty}</b><button onclick="qtyItem('${esc(i.id)}',1)">＋</button></div><div style="text-align:right"><div class="muted">小計</div><b>${yen(priceOf(i)*i.qty)}</b></div></div><div class="row between" style="margin-top:8px"><span></span><button class="danger small" onclick="removeItem('${esc(i.id)}')">削除</button></div></div>`}
function addItem(pid){if(!eventId){toast('イベントから商品を追加してください');return}const found=db.items.find(i=>i.eventId===eventId&&i.productId===pid);if(found)found.qty++;else db.items.push({id:uid(),eventId,productId:pid,qty:1,done:false});save();$('modal').close();detail();toast('購入リストに追加しました')}
function qtyItem(id,delta){const i=db.items.find(i=>i.id===id);if(i){i.qty=Math.max(1,i.qty+delta);save();detail()}}
function toggleItem(id){const i=db.items.find(i=>i.id===id);if(i){i.done=!i.done;save();detail()}}
function removeItem(id){if(!confirm('この商品を購入リストから削除しますか？'))return;db.items=db.items.filter(i=>i.id!==id);save();detail()}
function showModal(content){$('modal').innerHTML=content;$('modal').showModal()}
function pickProduct(){showModal(`<div class="row between"><h3>商品を選択</h3><button onclick="$('modal').close()">閉じる</button></div><input id="pickSearch" placeholder="商品名を検索" oninput="pickResults()"><select id="pickCat" style="margin:9px 0" onchange="pickResults()"><option value="">すべてのカテゴリー</option>${[...new Set(db.products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><div id="pickResults"></div>`);pickResults()}
function pickResults(){const q=($('pickSearch')?.value||'').toLowerCase(),cat=$('pickCat')?.value||'';const list=db.products.filter(p=>p.name.toLowerCase().includes(q)&&(!cat||p.category===cat));$('pickResults').innerHTML=`<div class="muted">${list.length}件</div>`+list.map(p=>productCard(p)).join('')}
function editEvent(id){const e=db.events.find(x=>x.id===id)||{name:'',date:'',venue:''};showModal(`<form onsubmit="submitEvent(event,'${esc(id||'')}')"><h3>${id?'イベント編集':'イベント追加'}</h3><label>イベント名<input name="name" required value="${esc(e.name)}"></label><label>日付<input type="date" name="date" value="${esc(e.date)}"></label><label>会場<input name="venue" value="${esc(e.venue)}"></label><menu><button type="button" onclick="$('modal').close()">キャンセル</button><button class="primary">保存</button></menu>${id?`<button type="button" class="danger" onclick="deleteEvent('${esc(id)}')">イベントを削除</button>`:''}</form>`)}
function submitEvent(ev,id){ev.preventDefault();const f=ev.target.elements;const e={id:id||uid(),name:f.name.value.trim(),date:f.date.value,venue:f.venue.value.trim()};if(id)Object.assign(db.events.find(x=>x.id===id),e);else db.events.push(e);save();$('modal').close();tab('events')}
function deleteEvent(id){if(!confirm('イベントと購入リストをすべて削除しますか？'))return;db.events=db.events.filter(x=>x.id!==id);db.items=db.items.filter(x=>x.eventId!==id);save();$('modal').close();tab('events')}
function editProduct(id){const p=db.products.find(x=>x.id===id)||{name:'',category:'',price:0,vendor:'',image_url:''};showModal(`<form onsubmit="submitProduct(event,'${esc(id||'')}')"><h3>${id?'商品編集':'商品登録'}</h3><label>商品名<input name="productName" required value="${esc(p.name)}"></label><label>カテゴリー<input name="category" list="categoryList" required value="${esc(p.category)}"><datalist id="categoryList">${[...new Set(db.products.map(p=>p.category))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label>単価（円）<input name="price" type="number" min="0" required value="${p.price}"></label><label>販売会場<input name="vendor" value="${esc(p.vendor)}" placeholder="東京・大阪・仙台など"></label><label>画像URL<input name="image_url" type="url" value="${esc(p.image_url)}"></label><menu><button type="button" onclick="$('modal').close()">キャンセル</button><button class="primary">保存</button></menu>${id?`<button type="button" class="danger" onclick="deleteProduct('${esc(id)}')">商品を削除</button>`:''}</form>`)}
function submitProduct(ev,id){ev.preventDefault();const f=ev.target.elements;const p={id:id||uid(),name:f.productName.value.trim(),category:f.category.value.trim(),price:Number(f.price.value),vendor:f.vendor.value.trim(),image_url:f.image_url.value.trim()};if(id)Object.assign(db.products.find(x=>x.id===id),p);else db.products.unshift(p);save();$('modal').close();tab('catalog');toast('商品を保存しました')}
function deleteProduct(id){if(db.items.some(i=>i.productId===id)){alert('購入リストに使われている商品は削除できません。先にリストから削除してください。');return}if(!confirm('この商品を削除しますか？'))return;db.products=db.products.filter(x=>x.id!==id);save();$('modal').close();tab('catalog')}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function backup(){download('haikyu-shopping-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');toast('バックアップを保存しました')}
function importBackup(ev){const f=ev.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.products)||!Array.isArray(data.events)||!Array.isArray(data.items))throw Error('形式が異なります');if(!confirm('現在のデータをバックアップの内容で置き換えます。よろしいですか？'))return;db=data;save();tab('settings');toast('復元しました')}catch(e){alert('バックアップを読み込めませんでした：'+e.message)}};reader.readAsText(f)}
function settings(){$('view').innerHTML=`<h2>設定・バックアップ</h2><div class="card stack"><div class="name">データの保存</div><div class="hint">購入記録はこのブラウザの端末内に保存されます。別のスマホ・ブラウザには自動で同期されません。ブラウザのデータ消去や端末変更に備えて、定期的にバックアップしてください。</div><button class="primary" onclick="backup()">⬇ バックアップをダウンロード</button><label>バックアップから復元（JSON）<input type="file" accept=".json,application/json" onchange="importBackup(event)"></label></div><div class="card"><div class="name">登録内容</div><p>商品 ${db.products.length}件 / イベント ${db.events.length}件 / 購入リスト ${db.items.length}件</p><button onclick="download('products.csv',toCSV(),'text/csv;charset=utf-8')">商品一覧CSVを書き出す</button></div><p class="footer">※ このアプリは個人用の非公式買い物メモです。画像は元のWebサイトから表示するため、ネット接続や画像URLの状態によって表示されないことがあります。公開ページに入力したデータが他の人と共有されることはありません（各ブラウザに保存されます）。</p>`}
function toCSV(){const cols=['id','name','category','price','vendor','image_url'];return '\ufeff'+[cols.join(','),...db.products.map(p=>cols.map(k=>'"'+String(p[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n')}
render();
</script></body></html>
